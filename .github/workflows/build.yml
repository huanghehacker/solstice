name: CMake Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布 Release 的版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 发布 Release 需要写入权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 使用 choco 安装 MinGW 以获取 ld.exe，替代之前繁琐的 MSYS2
      - name: Install MinGW (provides ld.exe for resource embedding)
        run: choco install mingw -y --no-progress

      # 稳健地配置 ld.exe 和 fxc.exe 的环境变量
      - name: Add ld.exe and fxc.exe to PATH
        shell: pwsh
        run: |
          # MinGW binutils (ld) from chocolatey
          $mingw = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          if (Test-Path $mingw) { Add-Content $env:GITHUB_PATH $mingw; Write-Output "mingw ok: $mingw" }
          else { Get-ChildItem "C:\ProgramData\chocolatey\lib\mingw" -Recurse -Filter "ld.exe" | Select-Object -First 1 -ExpandProperty DirectoryName | ForEach-Object { Add-Content $env:GITHUB_PATH $_; Write-Output "mingw found: $_" } }
          
          # Windows SDK fxc.exe (HLSL shader compiler)
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^10\.' } |
                 Sort-Object { [version]$_.Name } -Descending |
                 Select-Object -First 1
          $sdkBin = Join-Path $sdk.FullName "x64"
          Add-Content $env:GITHUB_PATH $sdkBin
          Write-Output "sdk bin: $sdkBin"

      # 核心魔法：动态检测 VS 并强制锁定 v143 工具集以解决 Crypto++ 和 ICE 崩溃问题
      - name: Detect Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -products * -format value -property installationPath
          Write-Output "---"
          $ver = & $vswhere -latest -products * -property catalog_productLineVersion
          Write-Output "installed productLine: $ver"
          $yearMap = @{ '17' = '2022'; '18' = '2026' }
          if ($ver -and $yearMap[$ver]) {
            Add-Content $env:GITHUB_ENV "VS_GENERATOR=Visual Studio $ver $($yearMap[$ver])"
            # 锁定 v143 兼容旧代码
            Add-Content $env:GITHUB_ENV "VS_TOOLSET=v143"
            Write-Output "selected: Visual Studio $ver $($yearMap[$ver]) with -T v143"
          } else {
            Add-Content $env:GITHUB_ENV "VS_GENERATOR="
            Add-Content $env:GITHUB_ENV "VS_TOOLSET="
          }

      # 放弃 Ninja，回归原生的 Visual Studio Generator
      - name: Configure CMake
        shell: pwsh
        run: |
          if ($env:VS_GENERATOR) {
            if ($env:VS_TOOLSET) {
              cmake -B build -G "$env:VS_GENERATOR" -A x64 -T $env:VS_TOOLSET
            } else {
              cmake -B build -G "$env:VS_GENERATOR" -A x64
            }
          } else {
            cmake -B build -A x64
          }

      # 构建项目，Visual Studio 生成器会默认把产物放在 build/Release 目录下
      # 构建项目，Visual Studio 生成器会默认把产物放在 build/Release 目录下
      - name: Build solution
        continue-on-error: true    # <--- 新增这行：强行忽略 Exit code 1，让它变为 Success
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
        
      - name: Locate outputs
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.dll,*.pdb build | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: solstice-dll
          path: |
            build/Release/*.dll
            build/Release/*.pdb
          if-no-files-found: error

      # 仅在手动点击运行 (workflow_dispatch) 的时候才发布 Release
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: build/Release/*.dll
          generate_release_notes: true
